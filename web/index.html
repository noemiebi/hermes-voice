<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hermes Voice">
<meta name="application-name" content="Hermes Voice">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="맥 미니의 Hermes Agent(Herbot)와 말로 대화하는 앱">
<title>Hermes Voice</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="app-name" id="appName">Herbot</span>
    <span class="conn" id="conn" title="연결 상태"><span class="dot"></span><span id="connText">연결 중</span></span>
  </div>
  <button type="button" class="icon-btn" id="newSession" aria-label="새 대화" title="새 대화">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button type="button" class="icon-btn" id="menuBtn" aria-label="설정" title="설정">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
  </button>
</header>

<main class="log" id="log" aria-live="polite">
</main>

<section class="dock" id="dock" data-state="idle">
  <button type="button" class="talk" id="talk" aria-label="대화 시작">
    <span class="orb-stage" aria-hidden="true">
      <span class="orb-ring" id="orbRing"></span>
      <span class="orb-pulse" id="orbPulse"></span>
      <span class="orb-core" id="orbCore"></span>
      <span class="orb-sweep"></span>
      <svg class="orb-icon mic" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
      <svg class="orb-icon mic-off" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path d="M4 4l16 16"/></svg>
    </span>
  </button>
  <div class="ctl-row">
    <button type="button" class="ctl-btn" id="micBtn" aria-label="마이크 끄기" title="마이크 끄기" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
    <button type="button" class="ctl-btn" id="soundBtn" aria-label="소리 끄기" title="소리 끄기" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7.5a6.5 6.5 0 0 1 0 9"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
    <button type="button" class="ctl-btn end" id="endBtn" aria-label="대화 끝내기" title="대화 끝내기" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>
  <div class="meter">
    <div class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="status-row">
    <span class="status" id="status" role="status" aria-live="polite">대기</span>
  </div>
  <form class="text-form" id="textForm" autocomplete="off" hidden>
    <input type="text" id="textInput" placeholder="글로 보내기" enterkeyhint="send" aria-label="글로 보내기">
    <button type="submit" aria-label="보내기" title="보내기">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>
</section>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="menu" hidden>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <span class="sheet-title">설정</span>
      <button type="button" class="icon-btn" id="menuClose" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-group">
      <div class="sheet-item">
        <span class="sheet-text" id="boostLabel">소리 크기</span>
        <div class="seg" id="boost" role="radiogroup" aria-labelledby="boostLabel">
          <button type="button" class="seg-btn" data-boost="1" role="radio">100%</button>
          <button type="button" class="seg-btn" data-boost="1.5" role="radio">150%</button>
          <button type="button" class="seg-btn" data-boost="2" role="radio">200%</button>
        </div>
      </div>
      <div class="sheet-item">
        <span class="sheet-text" id="modelLabel">추론 수준<small id="modelHint">빠름·깊게는 서버의 voice-fast·voice-deep 라우트</small></span>
        <div class="seg" id="model" role="radiogroup" aria-labelledby="modelLabel">
          <button type="button" class="seg-btn" data-model="voice-fast" role="radio">빠름</button>
          <button type="button" class="seg-btn" data-model="voice-deep" role="radio">깊게</button>
        </div>
      </div>
    </div>
    <div class="sheet-group">
      <label class="sheet-item">
        <span class="sheet-text">누르고 말하기<small>구체를 누르고 있는 동안만 듣습니다. 끄면 말하면 바로 알아듣습니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="pttMode">
      </label>
      <label class="sheet-item">
        <span class="sheet-text">에코 제거<small>스피커 소리가 내 말로 잡히지 않게 합니다. 끄면 소리가 수화부로 나와 작아집니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="aec">
      </label>
      <label class="sheet-item">
        <span class="sheet-text">답하는 동안 마이크 끄기<small>켜면 답을 끊고 끼어들 수 없습니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="halfDuplex">
      </label>
      <label class="sheet-item">
        <span class="sheet-text">알림음<small>대화 시작 준비가 끝났을 때, 말을 알아들었을 때, 답이 오래 걸릴 때 짧은 소리로 알립니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="earcon">
      </label>
      <label class="sheet-item">
        <span class="sheet-text">화면이 꺼져도 재생 유지<small>대화 중 무음 오디오를 함께 틀어 화면이 꺼지거나 다른 앱으로 가도 답이 이어지게 해 봅니다. 잠금 화면의 일시정지로 대화를 끝낼 수 있습니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="bgAudio">
      </label>
      <label class="sheet-item">
        <span class="sheet-text">글 입력칸<small>켜면 화면 맨 아래에 글로 보내는 입력칸이 나타납니다.</small></span>
        <input type="checkbox" class="switch" role="switch" id="showText">
      </label>
    </div>
    <div class="sheet-group">
      <form class="sheet-item token-item" id="tokenForm" autocomplete="off">
        <label class="sheet-text" for="tokenInput">접속 토큰<small>서버 .env의 VOICE_TOKEN 값. 비워 두면 토큰 없이 접속</small></label>
        <div class="token-row">
          <input type="password" id="tokenInput" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="접속 토큰">
          <button type="submit" class="token-save">저장</button>
        </div>
      </form>
    </div>
    <div class="sheet-ver" id="sheetVer"></div>
    <details class="sheet-info">
      <summary id="infoSummary">자세한 정보 ›</summary>
      <div id="info"></div>
    </details>
  </div>
</div>

<!-- 백그라운드 재생 유지(시도): 대화 중 무음 루프. JS가 대화 시작·끝에 play/pause -->
<audio id="bgKeep" src="silence.wav" loop playsinline preload="auto"></audio>

<script src="worklet.js"></script>
<script src="playcore.js"></script>
<script src="app.js"></script>
</body>
</html>
